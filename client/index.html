<!doctype html>
<html lang="en">
  <head>
    <script>
      (function() {
        try {
          var VALID_MODES = ['light', 'dark', 'system'];
          var STORAGE_KEY = 'app-theme';

          function getSystemPref() {
            return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }

          function isValidTheme(m) { return VALID_MODES.indexOf(m) !== -1; }

          function applyTheme(mode) {
            var effective = mode === 'system' ? getSystemPref() : mode;
            var isDark = effective === 'dark';
            document.documentElement.setAttribute('data-theme', effective);
            document.documentElement.style.colorScheme = effective;
            if (isDark) {
              document.documentElement.classList.add('dark');
            } else {
              document.documentElement.classList.remove('dark');
            }
          }

          var saved = localStorage.getItem(STORAGE_KEY);

          if (!saved || !isValidTheme(saved)) {
            try {
              var user = JSON.parse(localStorage.getItem('user') || '{}');
              saved = user && user.settings && user.settings.theme;
            } catch (e) {}
            if (!saved || !isValidTheme(saved)) {
              saved = 'dark';
              localStorage.setItem(STORAGE_KEY, 'dark');
            }
          }

          applyTheme(saved);

          if (saved === 'system') {
            var mql = window.matchMedia('(prefers-color-scheme: dark)');
            var listener = function() { applyTheme('system'); };
            try { mql.addEventListener('change', listener); } catch (e) {
              try { mql.addListener(listener); } catch (_) {}
            }
          }
        } catch (e) {}
      })();
    </script>

    <style>
      html { color-scheme: light dark; }
      #splash-screen {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        transition: opacity 0.4s ease, visibility 0.4s;
        background: #f5f3ef; color: #171717;
      }
      html.dark #splash-screen {
        background: #0f1111; color: #e7e4dd;
      }
      .splash-logo {
        width: 80px; height: 80px; margin-bottom: 24px;
        animation: splashPulse 2s infinite ease-in-out;
      }
      .splash-spinner {
        width: 40px; height: 40px; border-radius: 50%;
        border: 3px solid rgba(23,23,23,0.1);
        border-top-color: #1f2a33;
        animation: splashSpin 1s linear infinite;
      }
      html.dark .splash-spinner {
        border-color: rgba(255,255,255,0.1);
        border-top-color: #e7e4dd;
      }
      .splash-text {
        margin-top: 16px;
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 14px; font-weight: 500;
        letter-spacing: 0.1em; text-transform: uppercase;
        opacity: 0.8;
      }
      @keyframes splashSpin { to { transform: rotate(360deg); } }
      @keyframes splashPulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.05); opacity: 0.8; }
      }
      body.loaded #splash-screen {
        opacity: 0; visibility: hidden;
      }
    </style>
