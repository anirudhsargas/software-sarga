    <title>Sarga Print Shop</title>
    <style>
      #splash-screen {
        position: fixed;
        inset: 0;
        background: #0f1111;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.4s ease, visibility 0.4s;
      }
      .splash-logo {
        width: 80px;
        height: 80px;
        margin-bottom: 24px;
        animation: pulse 2s infinite ease-in-out;
      }
      .splash-spinner {
        width: 40px;
        height: 40px;
        border: 3px solid rgba(255, 255, 255, 0.1);
        border-top-color: #e7e4dd;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      .splash-text {
        margin-top: 16px;
        color: #e7e4dd;
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 14px;
        font-weight: 500;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        opacity: 0.8;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.05); opacity: 0.8; }
      }
      body.loaded #splash-screen {
        opacity: 0;
        visibility: hidden;
      }
    </style>
  </head>
  <body>
    <div id="splash-screen">
      <picture>
        <source type="image/avif" srcset="/icons/icon-48.avif 48w, /icons/icon-96.avif 96w, /icons/icon-192.avif 192w" sizes="80px">
        <source type="image/webp" srcset="/icons/icon-48.webp 48w, /icons/icon-96.webp 96w, /icons/icon-192.webp 192w" sizes="80px">
        <img src="/icons/icon-192.png" alt="Sarga" class="splash-logo" width="80" height="80" onerror="this.style.display='none'">
      </picture>
      <div class="splash-spinner"></div>
      <div class="splash-text">Sarga</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
