# fly.toml app configuration file for sarga-backend-prod
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
# Deploy with: fly deploy --config fly.prod.toml

app = 'sarga-backend-prod'
primary_region = 'bom'

[build]

[env]
  NODE_ENV = 'production'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
