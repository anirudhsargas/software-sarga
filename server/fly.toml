# fly.toml app configuration file for sarga-backend-staging
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
# To deploy staging:    fly deploy --config fly.staging.toml
# To deploy production: fly deploy --config fly.prod.toml

app = 'sarga-backend-staging'
primary_region = 'bom'

[build]

[env]
  NODE_ENV = 'staging'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
