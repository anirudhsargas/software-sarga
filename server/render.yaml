# Render service configuration for the backend.
# Update the fields below (envVars, build/start commands) to match your server setup.
services:
  - type: web
    name: sarga-backend
    env: node
    branch: main
    plan: starter
    # Build/start commands assume the repository has a 'server' folder with package.json
    buildCommand: cd server && npm ci
    startCommand: cd server && npm run start
    envVars:
      - key: NODE_ENV
        value: production
      # Render injects RENDER_EXTERNAL_URL — use hostWithScheme to get the full https:// URL.
      # This is used by the internal self-ping keep-alive to prevent cold-start spindown.
      - key: RENDER_EXTERNAL_URL
        fromService:
          type: web
          name: sarga-backend
          property: hostWithScheme
      # Hardcoded fallback in case the fromService reference doesn't resolve
      - key: SERVER_URL
        value: https://software-sarga-2.onrender.com
      - key: VITE_FIREBASE_API_KEY
        fromSecret: VITE_FIREBASE_API_KEY
      - key: VITE_FIREBASE_AUTH_DOMAIN
        fromSecret: VITE_FIREBASE_AUTH_DOMAIN
      - key: VITE_FIREBASE_PROJECT_ID
        fromSecret: VITE_FIREBASE_PROJECT_ID
      - key: VITE_FIREBASE_STORAGE_BUCKET
        fromSecret: VITE_FIREBASE_STORAGE_BUCKET
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        fromSecret: VITE_FIREBASE_MESSAGING_SENDER_ID
      - key: VITE_FIREBASE_APP_ID
        fromSecret: VITE_FIREBASE_APP_ID
      - key: VITE_FIREBASE_MEASUREMENT_ID
        fromSecret: VITE_FIREBASE_MEASUREMENT_ID
      - key: VITE_API_URL
        fromSecret: VITE_API_URL
      # Comma-separated list of allowed CORS origins, e.g.:
      # https://software-sarga.vercel.app,https://sargaoffset.vercel.app
      - key: CORS_ORIGIN
        fromSecret: CORS_ORIGIN
      - key: JWT_SECRET
        fromSecret: JWT_SECRET
      - key: CLOUDINARY_CLOUD_NAME
        fromSecret: CLOUDINARY_CLOUD_NAME
      - key: CLOUDINARY_API_KEY
        fromSecret: CLOUDINARY_API_KEY
      - key: CLOUDINARY_API_SECRET
        fromSecret: CLOUDINARY_API_SECRET
      - key: GEMINI_API_KEY
        fromSecret: GEMINI_API_KEY
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      # Add production secrets (DB, JWT, third-party keys) as Render secrets instead
      # Example using a secret reference:
      # - key: DATABASE_URL
      #   fromSecret: database_url

