# Render service configuration for the full-stack application.
# Place this file at the repository root.

services:
  # Python ML Microservice
  - type: web
    name: sarga-ml-service
    env: python
    branch: main
    plan: starter
    rootDir: ml-service
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 2 -b 0.0.0.0:$PORT app:app
    envVars:
      - key: FLASK_DEBUG
        value: "0"
      - key: DB_HOST
        fromSecret: DB_HOST
      - key: DB_USER
        fromSecret: DB_USER
      - key: DB_PASSWORD
        fromSecret: DB_PASSWORD
      - key: DB_NAME
        fromSecret: DB_NAME

  # Node.js Backend
  - type: web
    name: sarga-backend
    env: node
    branch: main
    plan: starter
    rootDir: server
    buildCommand: cd server && npm ci
    startCommand: cd server && npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_FIREBASE_API_KEY
        value: "AIzaSyAqsXy2h5rG0FQ0Cvreu1AIHC_-NRPxrpg"
      - key: VITE_FIREBASE_AUTH_DOMAIN
        value: "sarga-prints.firebaseapp.com"
      - key: VITE_FIREBASE_PROJECT_ID
        value: "sarga-prints"
      - key: VITE_FIREBASE_STORAGE_BUCKET
        value: "sarga-prints.firebasestorage.app"
