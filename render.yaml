# Render service configuration for the full-stack application.
# Place this file at the repository root.

services:
  # Python ML Microservice
  - type: web
    name: sarga-ml-service
    env: python
    branch: main
    plan: starter
    rootDir: ml-service
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 2 -b 0.0.0.0:$PORT app:app
    envVars:
      - key: FLASK_DEBUG
        value: "0"
      - key: DB_HOST
        fromSecret: DB_HOST
      - key: DB_USER
        fromSecret: DB_USER
      - key: DB_PASSWORD
        fromSecret: DB_PASSWORD
      - key: DB_NAME
        fromSecret: DB_NAME

  # Node.js Backend
  - type: web
    name: sarga-backend
    env: node
    branch: main
    plan: starter
    rootDir: server
    buildCommand: cd server && npm ci
    startCommand: cd server && npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_FIREBASE_API_KEY
        fromSecret: VITE_FIREBASE_API_KEY
      - key: VITE_FIREBASE_AUTH_DOMAIN
        fromSecret: VITE_FIREBASE_AUTH_DOMAIN
      - key: VITE_FIREBASE_PROJECT_ID
        fromSecret: VITE_FIREBASE_PROJECT_ID
      - key: VITE_FIREBASE_STORAGE_BUCKET
        fromSecret: VITE_FIREBASE_STORAGE_BUCKET
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        fromSecret: VITE_FIREBASE_MESSAGING_SENDER_ID
      - key: VITE_FIREBASE_APP_ID
        fromSecret: VITE_FIREBASE_APP_ID
      - key: VITE_FIREBASE_MEASUREMENT_ID
        fromSecret: VITE_FIREBASE_MEASUREMENT_ID
      - key: VITE_API_URL
        fromSecret: VITE_API_URL
      - key: CORS_ORIGIN
        fromSecret: CORS_ORIGIN
      - key: ML_SERVICE_URL
        fromSecret: ML_SERVICE_URL
      - key: JWT_SECRET
        fromSecret: JWT_SECRET
      - key: CLOUDINARY_CLOUD_NAME
        fromSecret: CLOUDINARY_CLOUD_NAME
      - key: CLOUDINARY_API_KEY
        fromSecret: CLOUDINARY_API_KEY
      - key: CLOUDINARY_API_SECRET
        fromSecret: CLOUDINARY_API_SECRET